<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Chat</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* ------------------- FIREBASE ------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
  authDomain: "safe-chat-c0b9c.firebaseapp.com",
  databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "safe-chat-c0b9c",
  storageBucket: "safe-chat-c0b9c.firebasestorage.app",
  messagingSenderId: "119640275300",
  appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ------------------- USER / ADMIN ------------------- */
let userId = localStorage.getItem("support_uid");
if (!userId) {
  userId = "user_" + Math.random().toString(36).substr(2, 8);
  localStorage.setItem("support_uid", userId);
}

const ADMIN_CODE = "mahtab666777";
let isAdmin = false;
let selectedUser = null;

/* ------------------- DOM ------------------- */
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const adminBar = document.getElementById("adminBar");
const title = document.getElementById("title");

/* New: username input */
const usernameInput = document.createElement("input");
usernameInput.id = "username";
usernameInput.placeholder = "Apna naam dalen";
usernameInput.style.padding = "10px";
usernameInput.style.border = "none";
usernameInput.style.borderRadius = "10px";
usernameInput.style.background = "#0f0f0f";
usernameInput.style.color = "#fff";
usernameInput.style.marginBottom = "6px";
document.querySelector(".input-box").prepend(usernameInput);

/* ------------------- TIME ------------------- */
const timeNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

/* ------------------- USER LISTENER ------------------- */
function startUserMode() {
  const myRef = ref(db, "supportChats/" + userId + "/messages");
  onChildAdded(myRef, snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (m.sender === "admin" ? "admin" : "user");
    div.innerHTML = `<strong>${m.name || "You"}:</strong> ${m.text}<div class="meta">${m.time}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* ------------------- ADMIN LISTENER ------------------- */
function startAdminMode() {
  messages.innerHTML = "";
  adminBar.style.display = "block";
  title.innerText = "👑 Admin Panel";

  const allRef = ref(db, "supportChats");
  onChildAdded(allRef, userSnap => {
    const uid = userSnap.key;
    selectedUser = uid; // last active user

    onChildAdded(ref(db, "supportChats/" + uid + "/messages"), msgSnap => {
      const m = msgSnap.val();
      const div = document.createElement("div");
      div.className = "msg " + (m.sender === "admin" ? "admin" : "user");
      div.innerHTML = `[${uid}] <strong>${m.name || "User"}:</strong> ${m.text}<div class="meta">${m.time}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });
  });
}

/* ------------------- SEND MESSAGE ------------------- */
function sendMsg() {
  const text = input.value.trim();
  if (!text) return;

  // ADMIN LOGIN
  if (!isAdmin && text === ADMIN_CODE) {
    isAdmin = true;
    input.value = "";
    startAdminMode();
    return;
  }

  // ADMIN REPLY
  if (isAdmin) {
    if (!selectedUser) { alert("No user yet"); return; }
    push(ref(db, "supportChats/" + selectedUser + "/messages"), {
      sender: "admin",
      text,
      name: "Admin",
      time: timeNow()
    });
    input.value = "";
    return;
  }

  // USER MESSAGE
  const username = usernameInput.value.trim();
  if (!username) { alert("Apna naam dalen pehle!"); return; }

  push(ref(db, "supportChats/" + userId + "/messages"), {
    sender: "user",
    text,
    name: username,
    time: timeNow()
  });
  input.value = "";
}

/* ------------------- INIT ------------------- */
startUserMode();
sendBtn.onclick = sendMsg;
input.addEventListener("keypress", e => e.key === "Enter" && sendMsg());
</script>

<style>
body{margin:0;background:#0b0b0f;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.chat{width:380px;height:660px;background:#121212;border-radius:18px;display:flex;flex-direction:column}
.header{padding:14px;background:#161616}
.header-title{color:#d4af37;font-weight:bold}
.admin-bar{display:none;background:#d4af37;color:#000;text-align:center;font-size:12px;padding:6px}
.messages{flex:1;padding:12px;overflow-y:auto}
.msg{max-width:78%;padding:10px;margin-bottom:8px;border-radius:12px}
.user{background:#1f2a33;color:#fff;margin-left:auto}
.admin{background:#d4af37;color:#000;margin-right:auto}
.meta{font-size:10px;opacity:.6}
.input-box{display:flex;flex-direction:column;padding:10px;background:#161616}
input{flex:1;padding:10px;border:none;border-radius:10px;background:#0f0f0f;color:#fff;margin-bottom:6px}
button{margin-left:6px;padding:10px 16px;border:none;border-radius:10px;background:#d4af37;font-weight:bold}
</style>

<body>
<div class="chat">
  <div class="header">
    <div class="header-title" id="title">Support Chat</div>
  </div>
  <div class="admin-bar" id="adminBar">ADMIN MODE</div>
  <div class="messages" id="messages"></div>
  <div class="input-box">
    <input id="input" placeholder="Type message">
    <button id="sendBtn">➤</button>
  </div>
</div>
</body>
</html>
