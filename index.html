<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Chat</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* ------------------- FIREBASE ------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
  authDomain: "safe-chat-c0b9c.firebaseapp.com",
  databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "safe-chat-c0b9c",
  storageBucket: "safe-chat-c0b9c.firebasestorage.app",
  messagingSenderId: "119640275300",
  appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ------------------- USER / ADMIN ------------------- */
let userId = localStorage.getItem("support_uid");
if (!userId) {
  userId = "user_" + Math.random().toString(36).substr(2, 8);
  localStorage.setItem("support_uid", userId);
}

const ADMIN_CODE = "mahtab666777";
let isAdmin = false;
let selectedUser = null;

/* ------------------- DOM ------------------- */
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const adminBar = document.getElementById("adminBar");
const title = document.getElementById("title");

/* New: user list sidebar */
const userListDiv = document.createElement("div");
userListDiv.id = "userList";
userListDiv.style.cssText = "width:120px;background:#161616;color:#fff;overflow-y:auto;padding:8px;display:none;";
document.querySelector(".chat").insertBefore(userListDiv, messages);

/* ------------------- TIME ------------------- */
const timeNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

/* ------------------- USER LISTENER ------------------- */
function startUserMode() {
  const myRef = ref(db, "supportChats/" + userId + "/messages");
  onChildAdded(myRef, snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (m.sender === "admin" ? "admin" : "user");
    div.innerHTML = m.text + `<div class="meta">${m.time}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* ------------------- ADMIN LISTENER ------------------- */
function startAdminMode() {
  messages.innerHTML = "";
  adminBar.style.display = "block";
  userListDiv.style.display = "block";
  title.innerText = "👑 Admin Panel";

  const allRef = ref(db, "supportChats");
  onChildAdded(allRef, userSnap => {
    const uid = userSnap.key;

    // Create user button
    const userBtn = document.createElement("button");
    userBtn.innerText = uid;
    userBtn.style.cssText = "width:100%;margin-bottom:4px;padding:6px;border:none;border-radius:6px;background:#0b0b0f;color:#fff;cursor:pointer;text-align:left;";
    userBtn.onclick = () => loadUserChat(uid);
    userListDiv.appendChild(userBtn);
  });
}

/* ------------------- LOAD SPECIFIC USER CHAT ------------------- */
function loadUserChat(uid) {
  selectedUser = uid;
  messages.innerHTML = ""; // clear previous chat

  const chatRef = ref(db, "supportChats/" + uid + "/messages");
  onChildAdded(chatRef, snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.className = "msg " + (m.sender === "admin" ? "admin" : "user");
    div.innerHTML = m.text + `<div class="meta">${m.time}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
}

/* ------------------- SEND MESSAGE ------------------- */
function sendMsg() {
  const text = input.value.trim();
  if (!text) return;

  // ADMIN LOGIN
  if (!isAdmin && text === ADMIN_CODE) {
    isAdmin = true;
    input.value = "";
    startAdminMode();
    return;
  }

  // ADMIN REPLY
  if (isAdmin) {
    if (!selectedUser) { alert("Select a user first"); return; }
    push(ref(db, "supportChats/" + selectedUser + "/messages"), {
      sender: "admin",
      text,
      time: timeNow()
    });
    input.value = "";
    return;
  }

  // USER MESSAGE
  push(ref(db, "supportChats/" + userId + "/messages"), {
    sender: "user",
    text,
    time: timeNow()
  });
  input.value = "";
}

/* ------------------- INIT ------------------- */
startUserMode();
sendBtn.onclick = sendMsg;
input.addEventListener("keypress", e => e.key === "Enter" && sendMsg());
</script>

<style>
body{margin:0;background:#0b0b0f;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.chat{width:500px;height:660px;background:#121212;border-radius:18px;display:flex;flex-direction:column;position:relative;display:flex}
.header{padding:14px;background:#161616}
.header-title{color:#d4af37;font-weight:bold}
.admin-bar{display:none;background:#d4af37;color:#000;text-align:center;font-size:12px;padding:6px}
.messages{flex:1;padding:12px;overflow-y:auto;margin-left:120px} /* leave space for user list */
.msg{max-width:78%;padding:10px;margin-bottom:8px;border-radius:12px}
.user{background:#1f2a33;color:#fff;margin-left:auto}
.admin{background:#d4af37;color:#000;margin-right:auto}
.meta{font-size:10px;opacity:.6}
.input-box{display:flex;padding:10px;background:#161616}
input{flex:1;padding:10px;border:none;border-radius:10px;background:#0f0f0f;color:#fff}
button{margin-left:6px;padding:10px 16px;border:none;border-radius:10px;background:#d4af37;font-weight:bold;cursor:pointer}
</style>

<body>
<div class="chat">
  <div class="header">
    <div class="header-title" id="title">Support Chat</div>
  </div>
  <div class="admin-bar" id="adminBar">ADMIN MODE</div>
  <div class="messages" id="messages"></div>
  <div class="input-box">
    <input id="input" placeholder="Type message">
    <button id="sendBtn">➤</button>
  </div>
</div>
</body>
</html>
