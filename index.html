<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHTAB SAFE CHAT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded, onValue,
  set, update, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* ---------------- FIREBASE ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
  authDomain: "safe-chat-c0b9c.firebaseapp.com",
  databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "safe-chat-c0b9c",
  storageBucket: "safe-chat-c0b9c.firebasestorage.app",
  messagingSenderId: "119640275300",
  appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ---------------- STATE ---------------- */
const ADMIN_CODE = "mahtab666777";
let uid = localStorage.getItem("uid") || "user_" + Math.random().toString(36).slice(2,8);
let name = localStorage.getItem("name");
let isAdmin = false;
let activeUser = null;

localStorage.setItem("uid", uid);

/* ---------------- DOM ---------------- */
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const title = document.getElementById("title");
const usersDiv = document.getElementById("users");
const adminTools = document.getElementById("adminTools");
const notice = document.getElementById("notice");

/* ---------------- SOUND ---------------- */
const sendSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
const receiveSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

/* ---------------- USER NAME ---------------- */
if (!name) {
  name = prompt("Enter your name");
  if (!name) name = "Guest";
  localStorage.setItem("name", name);
}

/* ---------------- USER INFO ---------------- */
const infoRef = ref(db, `chats/${uid}/info`);
set(infoRef, {
  name,
  online: true,
  lastSeen: Date.now(),
  blocked: false,
  locked: false,
  unread: 0
});

onDisconnect(infoRef).update({
  online: false,
  lastSeen: Date.now()
});

/* ---------------- USER MODE ---------------- */
function startUser() {
  onChildAdded(ref(db, `chats/${uid}/messages`), snap => {
    render(snap.key, snap.val());
    receiveSound.play();
  });

  onValue(ref(db, `chats/${uid}/info/locked`), s => {
    if (s.val()) {
      input.disabled = true;
      notice.innerText = "🔒 Chat is locked by admin";
    } else {
      input.disabled = false;
      notice.innerText = "";
    }
  });
}

/* ---------------- ADMIN DASHBOARD ---------------- */
function startAdmin() {
  title.innerText = "👑 Admin Dashboard";
  usersDiv.style.display = "block";
  adminTools.style.display = "flex";

  onChildAdded(ref(db, "chats"), snap => {
    const u = snap.key;
    const info = snap.val().info || {};
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = `
      <b>${info.name || u}</b>
      <small>Unread: ${info.unread || 0}</small>
      <small>${info.online ? "🟢 Online" : "Last seen: " + new Date(info.lastSeen).toLocaleTimeString()}</small>
    `;
    div.onclick = () => loadUser(u);
    usersDiv.appendChild(div);
  });
}

function loadUser(u) {
  activeUser = u;
  messages.innerHTML = "";
  update(ref(db, `chats/${u}/info`), { unread: 0 });

  onChildAdded(ref(db, `chats/${u}/messages`), snap => {
    render(snap.key, snap.val(), true);
    receiveSound.play();
  });
}

/* ---------------- SEND ---------------- */
sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!text) return;

  if (!isAdmin && text === ADMIN_CODE) {
    isAdmin = true;
    startAdmin();
    input.value = "";
    return;
  }

  const target = isAdmin ? activeUser : uid;
  if (!target) return alert("Select user");

  push(ref(db, `chats/${target}/messages`), {
    sender: isAdmin ? "admin" : "user",
    text,
    time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  });

  if (!isAdmin) {
    update(ref(db, `chats/${uid}/info`), { unread: (Math.random()*1000)|0 });
  }

  sendSound.play();
  input.value = "";
};

/* ---------------- ADMIN ACTIONS ---------------- */
document.getElementById("lockBtn").onclick = () => {
  if (!activeUser) return alert("Select user");
  update(ref(db, `chats/${activeUser}/info`), { locked: true });
};

document.getElementById("unlockBtn").onclick = () => {
  if (!activeUser) return alert("Select user");
  update(ref(db, `chats/${activeUser}/info`), { locked: false });
};

/* ---------------- RENDER ---------------- */
function render(id, m, adminView=false) {
  const d = document.createElement("div");
  d.className = "msg " + m.sender;
  d.innerHTML = `
    <div class="bubble">
      ${m.text}
      <span>${m.time}</span>
      ${adminView && m.sender==="admin" ? `
        <button onclick="editMsg('${id}')">✏️</button>
        <button onclick="delMsg('${id}')">🗑️</button>
      ` : ""}
    </div>
  `;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

window.delMsg = (id) => {
  if (!activeUser) return;
  if (!confirm("Delete message?")) return;
  remove(ref(db, `chats/${activeUser}/messages/${id}`));
};

window.editMsg = (id) => {
  const newText = prompt("Edit message");
  if (!newText) return;
  update(ref(db, `chats/${activeUser}/messages/${id}`), { text: newText });
};

/* ---------------- INIT ---------------- */
startUser();
</script>

<style>
body{margin:0;font-family:Poppins;background:#0f172a;color:#fff}
.chat{display:flex;height:100vh}
#users{width:240px;background:#020617;display:none;overflow:auto}
.user{padding:10px;border-bottom:1px solid #1e293b;cursor:pointer}
.user small{display:block;color:#94a3b8;font-size:11px}
.main{flex:1;display:flex;flex-direction:column}
.header{padding:14px;background:#d4af37;color:#000;font-weight:600}
.admin-tools{display:none;gap:6px;padding:8px;background:#020617}
.messages{flex:1;padding:12px;overflow:auto}
.msg{margin-bottom:8px;display:flex}
.user.msg{justify-content:flex-end}
.admin.msg{justify-content:flex-start}
.bubble{max-width:70%;padding:10px;border-radius:14px}
.user .bubble{background:#2563eb}
.admin .bubble{background:#f5d76e;color:#000}
.bubble span{display:block;font-size:10px;opacity:.6}
.input{display:flex;padding:10px;border-top:1px solid #1e293b}
input{flex:1;padding:10px;border-radius:10px;border:none}
button{padding:6px;border:none;border-radius:6px}
#notice{font-size:12px;color:#f87171;padding-left:10px}
</style>
</head>

<body>
<div class="chat">
  <div id="users"></div>
  <div class="main">
    <div class="header" id="title">MAHTAB SAFE CHAT</div>

    <div class="admin-tools" id="adminTools">
      <button id="lockBtn">🔒 Lock</button>
      <button id="unlockBtn">🔓 Unlock</button>
    </div>

    <div class="messages" id="messages"></div>
    <div id="notice"></div>

    <div class="input">
      <input id="input" placeholder="Type message">
      <button id="send">Send</button>
    </div>
  </div>
</div>
</body>
</html>
