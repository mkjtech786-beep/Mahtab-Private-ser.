<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHTAB HACK V5.1 - Color Prediction</title>
    <style>
        /* Dark Mode UI */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212; /* Dark Background */
            color: #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: #1F1F1F;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #4CAF50; /* Primary Green Accent */
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        /* Timer Styles and Animation */
        #timer-display {
            font-size: 3em;
            font-weight: bold;
            color: #FFC107; /* Gold/Yellow Accent for Timer */
            margin-bottom: 20px;
            padding: 15px;
            border: 3px solid #FFC107;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        #timer-display.running {
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Result Display and Animation */
        #result-display {
            font-size: 2.5em;
            font-weight: bold;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            border-radius: 8px;
            color: #121212;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        #result-display.show {
            opacity: 1;
            animation: zoomIn 0.5s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .red-bg { background-color: #FF4136; }
        .green-bg { background-color: #2ECC40; }

        /* Prediction Buttons */
        .buttons-grid {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
        }

        .prediction-button {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            color: white;
        }

        .prediction-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .red-btn { background-color: #FF4136; }
        .green-btn { background-color: #2ECC40; }

        .red-btn:active, .green-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAHTAB HACK V5.1</h1>
        <p>अगला रंग 30 सेकंड में.</p>
        
        <div id="timer-display" class="running">30</div>
        
        <div id="result-display"></div>

        <div class="buttons-grid">
            <button class="prediction-button red-btn" onclick="predictColor('Red')">RED</button>
            <button class="prediction-button green-btn" onclick="predictColor('Green')">GREEN</button>
        </div>
        <p style="margin-top: 20px; font-size: 0.8em; color: #757575;">यह परिणाम यादृच्छिक रूप से (Randomly) दिखाया जाता है।</p>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer-display');
        const resultDisplay = document.getElementById('result-display');
        let timer;
        const initialTime = 30;

        // Prediction Function (For demonstration only)
        function predictColor(color) {
            console.log(`User predicted: ${color}`);
            // यहाँ आप यूज़र की भविष्यवाणी को स्टोर कर सकते हैं
        }

        // Timer and Result Logic
        function startTimer() {
            let timeLeft = initialTime;
            timerDisplay.textContent = timeLeft;
            resultDisplay.classList.remove('show', 'red-bg', 'green-bg');
            timerDisplay.classList.add('running');

            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            timerDisplay.classList.remove('running');
            timerDisplay.textContent = "0";

            // Random Result Generation (Simulated RNG)
            const isRed = Math.random() < 0.5;
            const winningColor = isRed ? 'RED' : 'GREEN';
            const winningClass = isRed ? 'red-bg' : 'green-bg';

            resultDisplay.textContent = winningColor;
            resultDisplay.classList.add('show', winningClass);

            // Restart timer after a delay
            setTimeout(startTimer, 5000);
        }

        // Start the game on load
        window.onload = startTimer;
    </script>

</body>
</html>
