<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Chat V4 PRO</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getDatabase } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
    authDomain: "safe-chat-c0b9c.firebaseapp.com",
    databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "safe-chat-c0b9c",
    storageBucket: "safe-chat-c0b9c.firebasestorage.app",
    messagingSenderId: "119640275300",
    appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
  };

  const app = initializeApp(firebaseConfig);
  window.db = getDatabase(app);
</script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.chat{width:380px;height:660px;background:#121212;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.header{padding:14px;background:#161616}
.header-title{color:#d4af37;font-weight:bold}
.header-status{font-size:12px;color:#8f8f8f}
.admin-bar{display:none;background:#d4af37;color:#000;text-align:center;font-size:12px;padding:6px;font-weight:bold}
.messages{flex:1;padding:12px;overflow-y:auto}
.msg{max-width:78%;padding:10px 12px;margin-bottom:10px;border-radius:14px;font-size:14px}
.user{background:#1f2a33;color:#fff;margin-left:auto}
.admin{background:#d4af37;color:#000;margin-right:auto}
.meta{font-size:10px;opacity:.6;margin-top:4px}
.input-box{display:flex;padding:10px;background:#161616}
.input-box input{flex:1;padding:11px;border:none;border-radius:12px;background:#0f0f0f;color:#fff}
.input-box button{margin-left:8px;padding:11px 16px;border:none;border-radius:12px;background:#d4af37;color:#000;font-weight:bold}
</style>
</head>

<body>

<div class="chat">
  <div class="header">
    <div class="header-title" id="title">Telegram Help</div>
    <div class="header-status" id="status">online</div>
  </div>

  <div class="admin-bar" id="adminBar">👑 ADMIN MODE</div>
  <div class="messages" id="messages"></div>

  <div class="input-box">
    <input id="input" placeholder="Type message">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script type="module">
import { ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* UNIQUE USER ID */
let userId = localStorage.getItem("support_uid");
if (!userId) {
  userId = "user_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("support_uid", userId);
}

/* ADMIN */
const ADMIN_CODE = "mahtab666777";
let isAdmin = false;

/* DOM */
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const adminBar = document.getElementById("adminBar");
const title = document.getElementById("title");

/* TIME */
const timeNow = () => new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

/* 🔑 PRIVATE CHAT PATH */
const chatRef = ref(window.db, "supportChats/" + userId + "/messages");

/* READ */
onChildAdded(chatRef, (snap) => {
  const m = snap.val();
  const d = document.createElement("div");
  d.className = "msg " + (m.sender === "admin" ? "admin" : "user");
  d.innerHTML = m.text + `<div class="meta">${m.time}</div>`;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
});

/* SEND */
function sendMsg() {
  const text = input.value.trim();
  if (!text) return;

  if (text === ADMIN_CODE) {
    isAdmin = true;
    adminBar.style.display = "block";
    title.innerText = "👑 Admin Panel";
    input.value = "";
    return;
  }

  push(chatRef, {
    sender: isAdmin ? "admin" : "user",
    text,
    time: timeNow()
  });

  input.value = "";
}

sendBtn.onclick = sendMsg;
input.addEventListener("keypress", e => e.key === "Enter" && sendMsg());
</script>

</body>
</html>
