<script type="module">
import { ref, push, onChildAdded, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const adminBar = document.getElementById("adminBar");
const title = document.getElementById("title");
const status = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");
const usersList = document.getElementById("usersList");

const ADMIN_CODE = "mahtab666777";
let isAdmin = false;
let typingTimer;
let userId = "user_" + Math.floor(Math.random()*100000);
let selectedUser = null;

/* helpers */
function timeNow() {
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

/* Firebase refs */
const messagesRef = ref(window.db, 'messages');
const usersRef = ref(window.db, 'users');

/* Add user to users node */
set(ref(window.db,'users/'+userId),{banned:false, muted:false, vip:false});

/* Load users list */
function loadUsers(){
  usersList.innerHTML="";
  onValue(usersRef, snapshot=>{
    const data = snapshot.val() || {};
    usersList.innerHTML = "";
    for(let uid in data){
      const userDiv = document.createElement("div");
      userDiv.className="user-item";
      let statusTxt = data[uid].banned ? "🔒" : (data[uid].muted ? "🔇" : "");
      if(data[uid].vip) statusTxt += " ⭐";
      userDiv.innerHTML = uid + " " + statusTxt;

      // Ban/Unban button
      const banBtn = document.createElement("span");
      banBtn.className="ban-btn";
      banBtn.innerText = data[uid].banned ? "Unban" : "Ban";
      banBtn.onclick = ()=>{
        update(ref(window.db,'users/'+uid), {banned: !data[uid].banned});
      };
      userDiv.appendChild(banBtn);

      // Mute/Unmute button
      const muteBtn = document.createElement("span");
      muteBtn.className="ban-btn";
      muteBtn.style.marginLeft="4px";
      muteBtn.innerText = data[uid].muted ? "Unmute" : "Mute";
      muteBtn.onclick = ()=>{
        update(ref(window.db,'users/'+uid), {muted: !data[uid].muted});
      };
      userDiv.appendChild(muteBtn);

      // VIP toggle
      const vipBtn = document.createElement("span");
      vipBtn.className="ban-btn";
      vipBtn.style.marginLeft="4px";
      vipBtn.innerText = data[uid].vip ? "Remove VIP" : "VIP";
      vipBtn.onclick = ()=>{
        update(ref(window.db,'users/'+uid), {vip: !data[uid].vip});
      };
      userDiv.appendChild(vipBtn);

      // Select user to view messages
      userDiv.onclick=()=>{
        selectedUser = uid;
        messages.innerHTML="";
      };

      usersList.appendChild(userDiv);
    }
  });
}

/* Load messages */
onChildAdded(messagesRef, data=>{
  const msg = data.val();

  // filter messages: admin sees selected user only
  if(isAdmin && selectedUser && msg.sender !== selectedUser && msg.sender !== "admin") return;

  const div = document.createElement("div");
  div.className = msg.sender === userId ? "msg user" : (msg.sender==="admin" ? "msg admin" : "msg support");
  div.innerHTML = msg.text + `<div class="meta">${msg.time}</div>`;

  if(isAdmin){
    const del = document.createElement("span");
    del.className="delete-btn";
    del.innerText="×";
    del.onclick = ()=> remove(ref(window.db,'messages/'+data.key));
    div.appendChild(del);
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

/* fake online count */
setInterval(()=>{status.innerText = `online • ${5+Math.floor(Math.random()*5)} users`;},4000);

/* typing indicator */
input.addEventListener("input", ()=>{
  typing.style.display="block";
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typing.style.display="none",700);
});

/* send message */
async function sendMsg(){
  const text=input.value.trim();
  if(!text) return;

  /* admin login */
  if(text===ADMIN_CODE){
    isAdmin=true;
    adminBar.style.display="block";
    title.innerText="👑 Admin Panel";
    loadUsers();
    input.value="";
    return;
  }

  // check banned or muted for normal users
  const userNode = ref(window.db,'users/'+userId);
  const snap = await get(userNode);
  if(!isAdmin){
    const userData = snap.val();
    if(userData.banned){ alert("You are banned!"); input.value=""; return; }
    if(userData.muted){ alert("You are muted!"); input.value=""; return; }
  }

  let msgObj;
  if(isAdmin){
    // Admin sending to selected user
    if(selectedUser){
      msgObj = { sender:"admin", text:text, user:selectedUser, time:timeNow() };
    } else {
      // broadcast to all
      msgObj = { sender:"admin", text:text, user:"all", time:timeNow() };
    }
  } else {
    msgObj = { sender:userId, text:text, time:timeNow() };
  }

  push(messagesRef,msgObj).then(()=>console.log("Message sent"))
  .catch(e=>console.error("Firebase push error:", e));

  input.value="";
  typing.style.display="none";
}

/* bind send button */
sendBtn.addEventListener("click", sendMsg);

/* bind Enter key */
input.addEventListener("keypress",(e)=>{if(e.key==="Enter") sendMsg();});
</script>
