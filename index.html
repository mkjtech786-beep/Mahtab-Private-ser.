<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHTAB HACK V5.1 - VIP Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* VIP/Premium Dark Mode UI */
        :root {
            --bg-color: #0D1117; /* Deep Orbital Black */
            --card-color: #161B22;
            --text-color: #E6EDF3;
            --accent-gold: #FFD700;
            --red-glow: #FF4136;
            --green-glow: #2ECC40;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 18px;
            /* VIP Shadow Effect (Soft inner glow) */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 
                        inset 0 0 10px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #30363D;
        }

        h1 {
            color: var(--accent-gold); 
            margin-bottom: 5px;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); /* Title Glow */
        }

        p.subtitle {
            color: #8B949E;
            margin-bottom: 30px;
            font-size: 1em;
            font-weight: 500;
        }

        /* Timer Styles - Focused and prominent */
        #timer-box {
            background-color: var(--bg-color);
            padding: 20px 0;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363D;
        }

        #timer-display {
            font-size: 4.5em;
            font-weight: 900;
            color: var(--accent-gold); 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7); /* Timer Glow */
        }
        
        .running {
            animation: pulse 1.2s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.9; transform: scale(1.01); }
        }

        /* Result Display - High Impact */
        #result-display {
            font-size: 3.2em;
            font-weight: 900;
            height: 70px;
            line-height: 70px;
            margin-top: 30px;
            border-radius: 10px;
            color: var(--text-color);
            opacity: 0;
            transform: scale(0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease-out;
        }

        #result-display.show {
            opacity: 1;
            transform: scale(1);
            animation: zoomInBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes zoomInBounce {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        .red-bg { 
            background: linear-gradient(145deg, #a71d2a, #d82d3e);
            box-shadow: 0 0 20px var(--red-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .green-bg { 
            background: linear-gradient(145deg, #1f7a2f, #32cd32);
            box-shadow: 0 0 20px var(--green-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Prediction Buttons - Neumorphism/Soft 3D */
        .buttons-grid {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 40px;
        }

        .prediction-button {
            width: 50%;
            padding: 18px 10px;
            font-size: 1.2em;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.2s ease-in-out;
            letter-spacing: 1px;
            box-shadow: 4px 4px 10px #000000, -4px -4px 10px #24292F; /* Soft outer shadow */
        }

        .red-btn { background-color: #A32734; }
        .green-btn { background-color: #219B4C; }

        .prediction-button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* Active State for 3D Press Effect */
        .prediction-button:active {
            transform: translateY(0);
            /* Inset shadow for pressing effect */
            box-shadow: inset 4px 4px 10px #000000, inset -4px -4px 10px #24292F;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAHTAB HACK V5.1</h1>
        <p class="subtitle">🔴 VIP PREDICTION INTERFACE 🟢</p>
        
        <div id="timer-box">
            <div id="timer-display">10</div>
            <p style="font-size: 1em; margin: 0; color: #8B949E;">Remaining Seconds</p>
        </div>
        
        <div id="result-display"></div>

        <div class="buttons-grid">
            <button class="prediction-button red-btn" onclick="predictColor('Red')">RED</button>
            <button class="prediction-button green-btn" onclick="predictColor('Green')">GREEN</button>
        </div>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer-display');
        const resultDisplay = document.getElementById('result-display');
        const timerBox = document.getElementById('timer-box');
        
        let timer;
        const INITIAL_TIME = 10; // 10 seconds timer
        const RESULT_DISPLAY_DURATION = 5000; // Show result for 5 seconds

        function predictColor(color) {
            console.log(`User predicted: ${color}`);
            alert(`VIP Prediction Placed on ${color}. Waiting for result.`); 
        }

        // --- Algorithm Implementation (Unchanged, 10s Cycle) ---

        function startTimer() {
            let timeLeft = INITIAL_TIME;
            
            // UI Reset
            resultDisplay.classList.remove('show', 'red-bg', 'green-bg');
            resultDisplay.textContent = "";
            timerDisplay.textContent = timeLeft;
            timerBox.classList.add('running');

            // Timer Control
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            // Result Determination
            timerBox.classList.remove('running');
            timerDisplay.textContent = "0";

            // Random Result Generation (Simulating Server RNG)
            const isRed = Math.random() < 0.5;
            const winningColor = isRed ? 'RED' : 'GREEN';
            const winningClass = isRed ? 'red-bg' : 'green-bg';

            // VIP UI Update with Animation (Color Only)
            resultDisplay.textContent = winningColor;
            resultDisplay.classList.add('show', winningClass);
            
            // Next Cycle Preparation
            setTimeout(() => {
                startTimer();
            }, RESULT_DISPLAY_DURATION);
        }

        // Start the game cycle when the page loads
        window.onload = startTimer;
    </script>

</body>
</html>
