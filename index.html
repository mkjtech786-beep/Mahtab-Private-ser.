<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat Help</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-box{
  width:360px;
  height:600px;
  background:#111;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.chat-header{
  background:#1f1f1f;
  padding:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#00ff99;
  border-radius:16px 16px 0 0;
}

.chat-header.admin{
  color:#ff4d4d;
}

.chat-messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  max-width:75%;
  padding:10px 14px;
  margin-bottom:10px;
  border-radius:14px;
  font-size:14px;
}

.user{
  background:#2ecc71;
  color:#000;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.support{
  background:#2b2b2b;
  color:#fff;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

.admin{
  background:#ff4d4d;
  color:#fff;
  margin-right:auto;
}

.chat-input{
  display:flex;
  padding:10px;
  background:#1a1a1a;
  border-radius:0 0 16px 16px;
}

.chat-input input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  outline:none;
}

.chat-input button{
  margin-left:8px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#00ff99;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-box">
  <div class="chat-header" id="header">💬 CHAT HELP SUPPORT</div>

  <div class="chat-messages" id="messages">
    <div class="msg support">Hello 👋 How can we help you?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="input" placeholder="Type your message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const header = document.getElementById("header");

let isAdmin = false;
const ADMIN_CODE = "mahtab666777";

function sendMsg(){
  const text = input.value.trim();
  if(text === "") return;

  // SECRET ADMIN LOGIN
  if(text === ADMIN_CODE){
    isAdmin = true;
    header.innerText = "🔐 ADMIN PANEL";
    header.classList.add("admin");

    const adminMsg = document.createElement("div");
    adminMsg.className = "msg admin";
    adminMsg.innerText = "Admin mode activated ✅";
    messages.appendChild(adminMsg);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
    return;
  }

  // USER MESSAGE
  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = text;
  messages.appendChild(userMsg);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  // SUPPORT / ADMIN AUTO REPLY
  setTimeout(()=>{
    const reply = document.createElement("div");
    reply.className = "msg " + (isAdmin ? "admin" : "support");
    reply.innerText = isAdmin
      ? "Admin message received."
      : "Thanks for contacting support. Please wait.";
    messages.appendChild(reply);
    messages.scrollTop = messages.scrollHeight;
  },700);
}
</script>

</body>
</html>
