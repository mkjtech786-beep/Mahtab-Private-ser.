<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHTAB HACK V5.1 - Color Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Premium Dark Mode UI */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0A0A0A; /* Deep Dark Background */
            color: #F0F0F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: #1A1A1A;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #333; /* Subtle border for definition */
        }

        h1 {
            color: #4CAF50; /* Primary Green Accent */
            margin-bottom: 5px;
            font-size: 2em;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #AAAAAA;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* Timer Styles and Animation */
        #timer-box {
            background-color: #2C2C2C;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        #timer-display {
            font-size: 4em;
            font-weight: 700;
            color: #FFC107; /* Gold/Yellow Accent for Timer */
            transition: color 0.3s ease;
        }
        
        /* Pulse Animation for Timer */
        .running {
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.8; }
        }

        /* Result Display and Animation */
        #result-display {
            font-size: 2.8em;
            font-weight: 700;
            height: 60px;
            line-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            border-radius: 10px;
            color: #1A1A1A;
            opacity: 0;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            transform: scale(0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        #result-display.show {
            opacity: 1;
            transform: scale(1);
            /* Winning Animation: Quick bounce/zoom */
            animation: zoomInBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes zoomInBounce {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .red-bg { background-color: #FF4136; }
        .green-bg { background-color: #2ECC40; }

        /* Prediction Buttons */
        .buttons-grid {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 30px;
        }

        .prediction-button {
            width: 50%;
            padding: 15px 10px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            color: white;
            letter-spacing: 1px;
        }

        .prediction-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        .red-btn { 
            background-color: #C0392B; 
            border-bottom: 4px solid #922B21; 
        }
        .green-btn { 
            background-color: #27AE60; 
            border-bottom: 4px solid #1E8449; 
        }
