<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MAHTAB HACK V19</title>

<style>
body{
  background:#0b0b0b;
  font-family:Arial;
  color:#fff;
  display:flex;
  justify-content:center;
}
.app{
  width:360px;
  text-align:center;
}
#timer{
  font-size:40px;
  margin:15px 0;
}
.box{
  padding:30px;
  font-size:32px;
  border-radius:15px;
  margin:15px 0;
  animation:pulse 1s infinite;
}
.red{background:#ff3b3b;}
.green{background:#2ecc71;}
.violet{background:#9b59b6;}
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}
ul{list-style:none;padding:0;}
li{
  padding:8px;
  margin:5px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="app">
  <h2>MAHTAB HACK V19</h2>

  <div id="timer">03:00</div>

  <div id="prediction" class="box green">
    NEXT COLOR
  </div>

  <h3>Last Results</h3>
  <ul id="history"></ul>
</div>

<audio id="sound" src="https://assets.mixkit.co/active_storage/sfx/2577/2577-preview.mp3"></audio>

<!-- 🔥 FIREBASE + LOGIC -->
<script type="module">

/* ✅ FIREBASE CDN (WEB READY) */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

/* ✅ YOUR FIREBASE CONFIG (CONNECTED) */
const firebaseConfig = {
  apiKey: "AIzaSyDnkwQk4Y11adyGkiCog4H8xi_ZjCgHUaE",
  authDomain: "clubpkr-87519.firebaseapp.com",
  databaseURL: "https://clubpkr-87519-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "clubpkr-87519",
  storageBucket: "clubpkr-87519.firebasestorage.app",
  messagingSenderId: "323435934947",
  appId: "1:323435934947:web:97568617db4f891ce281d6"
};

/* INIT */
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ELEMENTS */
const historyEl = document.getElementById("history");
const predBox = document.getElementById("prediction");
const sound = document.getElementById("sound");
const timerEl = document.getElementById("timer");

/* 🔥 LIVE DATA FROM FIREBASE */
onValue(ref(db, "p_time01"), snap => {
  const data = snap.val();
  if (!data) return;

  // ✅ SORT BY PERIOD (FIXED)
  const rows = Object.values(data)
    .filter(r => r && r.period)
    .sort((a,b)=>Number(a.period)-Number(b.period));

  historyEl.innerHTML = "";

  rows.slice(-10).reverse().forEach(r=>{
    const li=document.createElement("li");
    li.textContent = `${r.period} → ${r.color.toUpperCase()}`;
    li.className = r.color;
    historyEl.appendChild(li);
  });

  predict(rows);
});

/* 🔮 COLOR PREDICTION */
function predict(rows){
  if(rows.length < 2) return;

  const last = rows[rows.length-1].color;
  const prev = rows[rows.length-2].color;

  let next;
  if(last === prev){
    next = last === "red" ? "green" : "red";
  }else{
    next = ["red","green","violet"][Math.floor(Math.random()*3)];
  }

  predBox.className = `box ${next}`;
  predBox.innerText = `NEXT: ${next.toUpperCase()}`;
  sound.play();
}

/* ⏱️ 3-MINUTE TIMER */
let sec = 180;
setInterval(()=>{
  sec--;
  if(sec <= 0) sec = 180;
  let m = String(Math.floor(sec/60)).padStart(2,"0");
  let s = String(sec%60).padStart(2,"0");
  timerEl.innerText = `${m}:${s}`;
},1000);

</script>
</body>
</html>
