<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHTAB PAID SERVER - Prediction</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --accent-color: #fbc02d; /* Golden/Yellow Premium Accent */
            --green: #4caf50;
            --red: #f44336;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* --- Header/Name --- */
        .header {
            width: 100%;
            padding: 20px 0;
            background-color: var(--card-bg);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
            letter-spacing: 1.5px;
        }

        /* --- Main Card/Container --- */
        .prediction-container {
            width: 90%;
            max-width: 400px; /* Mobile-first constraint */
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        /* --- Timer Display --- */
        .timer-box {
            background-color: #000;
            border: 2px solid var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .timer-box p {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--green); /* Initial color */
            transition: color 0.3s ease-in-out;
            margin-top: 0;
            margin-bottom: 0;
        }

        /* --- Result/Animation Box --- */
        .result-box {
            padding: 20px;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease-in-out;
            background-color: #333; /* Default gray before result */
        }

        #result-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
            opacity: 0; /* Hidden initially */
            transition: opacity 0.5s ease-in-out;
        }
        
        /* --- Prediction Animation Spinner --- */
        .spinner {
            border: 8px solid rgba(255, 255, 255, 0.1);
            border-top: 8px solid var(--accent-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden initially */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Result Colors --- */
        .result-box.green-result {
            background-color: var(--green);
        }

        .result-box.red-result {
            background-color: var(--red);
        }

        .result-box.show-text #result-text {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MAHTAB PAID SERVER</h1>
    </div>

    <div class="prediction-container">
        
        <div class="timer-box">
            <p>Always Level Maintain</p>
            <h2 id="timer">60</h2>
        </div>

        <div class="result-box">
            <div class="spinner" id="spinner"></div>
            <h2 id="result-text">---</h2>
        </div>

    </div>

    <script>
        // DOM Elements
        const timerDisplay = document.getElementById('timer');
        const resultBox = document.querySelector('.result-box');
        const resultText = document.getElementById('result-text');
        const spinner = document.getElementById('spinner');

        // Game State Variables
        let timeLeft = 60; // 1 minute in seconds
        let timerInterval;

        /**
         * टाइमर को अपडेट करता है और शून्य पर प्रेडिक्शन लॉजिक चलाता है।
         */
        function updateTimer() {
            timeLeft--;
            timerDisplay.textContent = timeLeft.toString().padStart(2, '0');

            // 10 सेकंड से कम होने पर टाइमर का रंग बदलें
            if (timeLeft <= 10) {
                timerDisplay.style.color = 'var(--red)';
            } else {
                timerDisplay.style.color = 'var(--green)';
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showPredictionAnimation();
            }
        }

        /**
         * प्रेडिक्शन एनिमेशन दिखाता है और 3 सेकंड बाद रिजल्ट दिखाता है।
         */
        function showPredictionAnimation() {
            // Reset UI for animation
            resultBox.classList.remove('green-result', 'red-result', 'show-text');
            resultBox.style.backgroundColor = '#333';
            resultText.textContent = '';
            spinner.style.display = 'block';

            // Animation Timer (3 seconds)
            setTimeout(() => {
                spinner.style.display = 'none';
                generateResult();
            }, 3000);
        }

        /**
         * रैंडम (या अपने लॉजिक) के आधार पर ग्रीन या रेड रिजल्ट जनरेट करता है।
         */
        function generateResult() {
            // Random Prediction Logic (50% chance for Green/Red)
            const isGreen = Math.random() >= 0.5;
            const result = isGreen ? 'GREEN' : 'RED';
            
            // Apply result styles and text
            resultText.textContent = result;
            resultBox.classList.add('show-text');
            
            if (isGreen) {
                resultBox.classList.add('green-result');
            } else {
                resultBox.classList.add('red-result');
            }

            // Start the next round after 5 seconds
            setTimeout(startTimer, 5000);
        }

        /**
         * गेम के अगले राउंड के लिए टाइमर शुरू करता है।
         */
        function startTimer() {
            // Reset state
            timeLeft = 60;
            timerDisplay.textContent = timeLeft.toString().padStart(2, '0');
            resultBox.classList.remove('green-result', 'red-result', 'show-text');
            resultBox.style.backgroundColor = '#333';
            resultText.textContent = '---';
            spinner.style.display = 'none';

            // Start the interval
            timerInterval = setInterval(updateTimer, 1000);
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', startTimer);
    </script>

</body>
</html>
