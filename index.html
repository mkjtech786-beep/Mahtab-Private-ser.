<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Help Support</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-box{
  width:360px;
  height:600px;
  background:#111;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

/* HEADER */
.chat-header{
  background:#1f1f1f;
  padding:15px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#00ff99;
  border-radius:16px 16px 0 0;
}

/* MESSAGES */
.chat-messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  max-width:75%;
  padding:10px 14px;
  margin-bottom:10px;
  border-radius:14px;
  font-size:14px;
  line-height:1.4;
}

.user{
  background:#2ecc71;
  color:#000;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.support{
  background:#2b2b2b;
  color:#fff;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

/* INPUT */
.chat-input{
  display:flex;
  padding:10px;
  background:#1a1a1a;
  border-radius:0 0 16px 16px;
}

.chat-input input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.chat-input button{
  margin-left:8px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#00ff99;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-box">
  <div class="chat-header">💬 CHAT HELP SUPPORT</div>

  <div class="chat-messages" id="messages">
    <div class="msg support">Hello 👋<br>How can we help you?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="input" placeholder="Type your message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");

function sendMsg(){
  if(input.value.trim()==="") return;

  // user message
  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = input.value;
  messages.appendChild(userMsg);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  // auto support reply
  setTimeout(()=>{
    const supportMsg = document.createElement("div");
    supportMsg.className = "msg support";
    supportMsg.innerText = "Thanks for contacting support. Please wait, our team will reply shortly.";
    messages.appendChild(supportMsg);
    messages.scrollTop = messages.scrollHeight;
  },800);
}
</script>

</body>
</html>
