<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHTAB HACK V5.1 - Auto Result Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* VIP/Premium Dark Mode UI */
        :root {
            --bg-color: #0D1117; /* Deep Orbital Black */
            --card-color: #161B22;
            --text-color: #E6EDF3;
            --accent-gold: #FFD700;
            --red-glow: #FF4136;
            --green-glow: #2ECC40;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            flex-direction: column;
        }

        .container {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 
                        inset 0 0 10px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #30363D;
        }

        h1 {
            color: var(--accent-gold); 
            margin-bottom: 5px;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        p.subtitle {
            color: #8B949E;
            margin-bottom: 30px;
            font-size: 1em;
            font-weight: 500;
        }

        /* Timer Box */
        #timer-box {
            background-color: var(--bg-color);
            padding: 20px 0;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363D;
        }

        #timer-display {
            font-size: 4.5em;
            font-weight: 900;
            color: var(--accent-gold); 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        /* Time remaining text */
        .time-label {
            font-size: 1em; margin: 0; color: #8B949E;
        }

        .running {
            animation: pulse 1.2s infinite alternate;
        }

        /* Result Display - High Impact */
        #result-display {
            font-size: 3.2em;
            font-weight: 900;
            height: 70px;
            line-height: 70px;
            margin-top: 30px;
            border-radius: 10px;
            color: var(--text-color);
            opacity: 0;
            transform: scale(0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease-out;
        }
        
        #result-display.show {
            opacity: 1;
            transform: scale(1);
            /* Zoom In Animation */
            animation: zoomInBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .red-bg { 
            background: linear-gradient(145deg, #a71d2a, #d82d3e);
            box-shadow: 0 0 20px var(--red-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .green-bg { 
            background: linear-gradient(145deg, #1f7a2f, #32cd32);
            box-shadow: 0 0 20px var(--green-glow), inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>MAHTAB HACK V5.1</h1>
        <p class="subtitle">🔴 1 MINUTE AUTO RESULT DEMO 🟢</p>
        
        <div id="timer-box">
            <div id="timer-display">60</div>
            <p class="time-label">Remaining Seconds</p>
        </div>
        
        <div id="result-display"></div>

        <p style="margin-top: 20px; color: #8B949E; font-size: 0.9em;">(System is running in fully automated mode)</p>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer-display');
        const resultDisplay = document.getElementById('result-display');
        const timerBox = document.getElementById('timer-box');
        
        let timer;
        const INITIAL_TIME = 60; // 1 minute (60 seconds)
        const RESULT_DISPLAY_DURATION = 5000; // Show result for 5 seconds
        let cycleCount = 1;

        // Helper function to format seconds into MM:SS
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            let timeLeft = INITIAL_TIME;
            
            // 1. Initial Setup and UI Reset
            resultDisplay.classList.remove('show', 'red-bg', 'green-bg');
            resultDisplay.textContent = "Waiting for Cycle " + cycleCount + "...";
            timerDisplay.textContent = formatTime(timeLeft);
            timerBox.classList.add('running');

            // 2. Timer Control (Runs every second)
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = formatTime(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            // 3. Result Determination
            timerBox.classList.remove('running');
            timerDisplay.textContent = "00:00";

            // 3.1 Random Result Generation (Simulating Server RNG)
            const isRed = Math.random() < 0.5;
            const winningColor = isRed ? 'RED' : 'GREEN';
            const winningClass = isRed ? 'red-bg' : 'green-bg';

            // 3.2 UI Update with Animation
            resultDisplay.textContent = winningColor;
            resultDisplay.classList.add('show', winningClass);

            // 4. Next Cycle Preparation
            setTimeout(() => {
                cycleCount++;
                startTimer();
            }, RESULT_DISPLAY_DURATION);
        }

        // Start the game cycle when the page loads
        window.onload = startTimer;
    </script>

</body>
</html>
