<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Chat Mobile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
  authDomain: "safe-chat-c0b9c.firebaseapp.com",
  databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "safe-chat-c0b9c",
  storageBucket: "safe-chat-c0b9c.firebasestorage.app",
  messagingSenderId: "119640275300",
  appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_CODE = "mahtab666777";
let uid = localStorage.getItem("uid") || "user_" + Math.random().toString(36).slice(2,8);
let name = localStorage.getItem("name");
let isAdmin = false;
let activeUser = null;
localStorage.setItem("uid", uid);

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const title = document.getElementById("title");
const usersDiv = document.getElementById("users");
const adminTools = document.getElementById("adminTools");
const notice = document.getElementById("notice");

const sendSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
const receiveSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3");

if (!name) {
  name = prompt("Enter your name") || "Guest";
  localStorage.setItem("name", name);
}

const infoRef = ref(db, `chats/${uid}/info`);
set(infoRef, { name, online: true, lastSeen: Date.now(), blocked: false, locked: false, unread: 0 });
onDisconnect(infoRef).update({ online: false, lastSeen: Date.now() });

function startUser() {
  onChildAdded(ref(db, `chats/${uid}/messages`), snap => {
    const m = snap.val();
    render(snap.key, m);
    if(m.sender !== "user") receiveSound.play();
  });

  onValue(ref(db, `chats/${uid}/info/locked`), s => {
    input.disabled = s.val();
    notice.innerText = s.val() ? "🔒 Chat is locked by admin" : "";
  });
}

function startAdmin() {
  title.innerHTML = "<span class='premium-title'>👑 Admin Dashboard</span>";
  usersDiv.style.display = "block";
  adminTools.style.display = "flex";

  onChildAdded(ref(db, "chats"), snap => {
    const u = snap.key;
    const info = snap.val().info || {};
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = `
      <b>${info.name || u}</b>
      <small>Unread: ${info.unread || 0}</small>
      <small>${info.online ? "🟢 Online" : "Last seen: " + new Date(info.lastSeen).toLocaleTimeString()}</small>
    `;
    div.onclick = () => loadUser(u);
    usersDiv.appendChild(div);
  });
}

function loadUser(u) {
  activeUser = u;
  messages.innerHTML = "";
  update(ref(db, `chats/${u}/info`), { unread: 0 });

  onChildAdded(ref(db, `chats/${u}/messages`), snap => {
    render(snap.key, snap.val(), true);
    receiveSound.play();
  });
}

sendBtn.onclick = () => {
  const text = input.value.trim();
  if (!text) return;

  if (!isAdmin && text === ADMIN_CODE) {
    isAdmin = true;
    startAdmin();
    input.value = "";
    return;
  }

  const target = isAdmin ? activeUser : uid;
  if (!target) return alert("Select user");

  push(ref(db, `chats/${target}/messages`), {
    sender: isAdmin ? "admin" : "user",
    text,
    time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  });

  if (isAdmin && activeUser) update(ref(db, `chats/${activeUser}/info`), { unread: (Math.random()*1000)|0 });
  sendSound.play();
  input.value = "";
};

document.getElementById("lockBtn").onclick = () => {
  if (!activeUser) return alert("Select user");
  update(ref(db, `chats/${activeUser}/info`), { locked: true });
};
document.getElementById("unlockBtn").onclick = () => {
  if (!activeUser) return alert("Select user");
  update(ref(db, `chats/${activeUser}/info`), { locked: false });
};

function render(id, m, adminView=false) {
  const d = document.createElement("div");
  d.className = "msg " + m.sender;
  d.innerHTML = `<div class="bubble">
                   ${m.text}
                   <span>${m.time}</span>
                   ${adminView && m.sender==="admin" ? `
                     <button onclick="editMsg('${id}')">✏️</button>
                     <button onclick="delMsg('${id}')">🗑️</button>` : ""}
                 </div>`;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

window.delMsg = (id) => { if (!activeUser) return; if (!confirm("Delete message?")) return; remove(ref(db, `chats/${activeUser}/messages/${id}`)); };
window.editMsg = (id) => { const newText = prompt("Edit message"); if (!newText) return; update(ref(db, `chats/${activeUser}/messages/${id}`), { text: newText }); };

startUser();
</script>

<style>
body { margin:0; font-family:Poppins,sans-serif; background:#1a1a2e; color:#fff; }
.chat { display:flex; flex-direction:column; height:100vh; width:100vw; }
.header { padding:16px; background:#14142b; font-weight:600; display:flex; justify-content:center; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.5);}
.premium-title { color:#fbb034; font-size:20px; text-shadow:0 0 10px #fbb034,0 0 20px #ffdd7e; }

.admin-tools { display:none; gap:8px; padding:10px; background:#1b1b38; flex-wrap:wrap; }
.admin-tools button { flex:1; padding:8px 12px; border:none; border-radius:8px; background:#fbb034; color:#14142b; font-weight:600; cursor:pointer; transition:0.3s; box-shadow:0 2px 10px rgba(251,176,52,0.5);}
.admin-tools button:hover { transform:scale(1.05); box-shadow:0 4px 20px rgba(251,176,52,0.7); }

.messages { flex:1; padding:12px; overflow:auto; }
.msg { margin-bottom:10px; display:flex; }
.user.msg { justify-content:flex-end; }
.admin.msg { justify-content:flex-start; }
.bubble { max-width:75%; padding:12px 16px; border-radius:18px; position:relative; box-shadow:0 4px 15px rgba(0,0,0,0.5); transition:0.3s; word-wrap:break-word; }
.user .bubble { background:#fbb034; color:#14142b; }
.admin .bubble { background:#14142b; color:#fbb034; border:1px solid #fbb034; }
.bubble span { display:block; font-size:11px; opacity:0.6; margin-top:4px; }
.bubble button { margin-left:5px; background:#fff; color:#14142b; border:none; padding:2px 5px; border-radius:5px; cursor:pointer; font-size:10px; }

.input { display:flex; padding:10px; border-top:1px solid #333; background:#14142b; }
input { flex:1; padding:12px 16px; border-radius:25px; border:none; background:#2c2c55; color:#fff; outline:none; font-size:14px; }
button#send { padding:10px 18px; margin-left:10px; border:none; border-radius:25px; background:#fbb034; color:#14142b; font-weight:600; cursor:pointer; transition:0.3s; }
button#send:hover { transform:scale(1.05); }

#notice { font-size:12px; color:#ff6b6b; margin:4px 0 0 12px; }

/* SCROLLBAR */
.messages::-webkit-scrollbar { width:6px; }
.messages::-webkit-scrollbar-thumb { background:#fbb034; border-radius:4px; }
.messages::-webkit-scrollbar-track { background:#1a1a2e; }
</style>
</head>

<body>
<div class="chat">
  <div class="header" id="title">Support Chat Pro</div>
  <div class="admin-tools" id="adminTools">
    <button id="lockBtn">🔒 Lock</button>
    <button id="unlockBtn">🔓 Unlock</button>
  </div>
  <div class="messages" id="messages"></div>
  <div id="notice"></div>
  <div class="input">
    <input id="input" placeholder="Type your message...">
    <button id="send">Send</button>
  </div>
</div>
</body>
</html>
