<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp Help Chat</title>

<style>
body{
  margin:0;
  background:#0b141a;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat{
  width:360px;
  height:600px;
  background:#efeae2;
  display:flex;
  flex-direction:column;
  border-radius:12px;
  overflow:hidden;
}

/* HEADER */
.header{
  background:#075e54;
  color:#fff;
  padding:10px;
}
.header-title{
  font-weight:bold;
}
.header-status{
  font-size:12px;
  color:#d4f8e8;
}

/* MESSAGES */
.messages{
  flex:1;
  padding:10px;
  overflow-y:auto;
  background:url("https://i.imgur.com/8bQpE6P.png");
}

.msg{
  max-width:75%;
  padding:8px 10px;
  margin-bottom:8px;
  border-radius:8px;
  font-size:14px;
  line-height:1.4;
}

.user{
  background:#dcf8c6;
  margin-left:auto;
  border-bottom-right-radius:0;
}

.support{
  background:#fff;
  margin-right:auto;
  border-bottom-left-radius:0;
}

.admin{
  background:#f44336;
  color:#fff;
  margin-right:auto;
}

.typing{
  font-size:12px;
  color:#555;
  margin-left:10px;
  margin-bottom:5px;
}

/* INPUT */
.input-box{
  display:flex;
  padding:8px;
  background:#f0f0f0;
}
.input-box input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:20px;
  outline:none;
}
.input-box button{
  margin-left:6px;
  background:#25d366;
  border:none;
  color:#fff;
  padding:10px 14px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
}

/* ADMIN BAR */
.admin-bar{
  display:none;
  background:#b71c1c;
  color:#fff;
  text-align:center;
  font-size:12px;
  padding:4px;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header" id="header">
    <div class="header-title">Help Support</div>
    <div class="header-status" id="status">online</div>
  </div>

  <div class="admin-bar" id="adminBar">ADMIN MODE</div>

  <div class="messages" id="messages">
    <div class="msg support">Hello 👋 How can we help you?</div>
  </div>

  <div class="typing" id="typing" style="display:none;">typing…</div>

  <div class="input-box">
    <input type="text" id="input" placeholder="Type a message">
    <button onclick="sendMsg()">➤</button>
  </div>

</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const adminBar = document.getElementById("adminBar");
const header = document.getElementById("header");

let isAdmin = false;
const ADMIN_CODE = "mahtab666777";
let typingTimer;

/* typing indicator */
input.addEventListener("input",()=>{
  typing.style.display="block";
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typing.style.display="none",700);
});

function sendMsg(){
  const text=input.value.trim();
  if(!text) return;

  /* secret admin login */
  if(text===ADMIN_CODE){
    isAdmin=true;
    adminBar.style.display="block";
    header.querySelector(".header-title").innerText="Admin Panel";
    input.value="";
    return;
  }

  const userMsg=document.createElement("div");
  userMsg.className="msg user";
  userMsg.innerText=text;
  messages.appendChild(userMsg);
  input.value="";
  messages.scrollTop=messages.scrollHeight;

  typing.style.display="block";

  setTimeout(()=>{
    typing.style.display="none";
    const reply=document.createElement("div");
    reply.className="msg "+(isAdmin?"admin":"support");
    reply.innerText=isAdmin
      ?"Admin received message."
      :"Thanks for contacting support.";
    messages.appendChild(reply);
    messages.scrollTop=messages.scrollHeight;
  },1000);
}
</script>

</body>
</html>
