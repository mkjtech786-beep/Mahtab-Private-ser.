    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-color: #ff4444;
            --background-color: #1a1a1a;
            --surface-color: #2a2a2a;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* User Registration Modal - Apple Design */
        .user-registration-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .registration-form {
            background: rgba(42, 42, 42, 0.95);
            border-radius: 20px;
            padding: 32px 24px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .registration-form h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #ff4444;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 16px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            font-weight: 400;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ff4444;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4444, #ff6666);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 68, 68, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Main App Container */
        .main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
        }

        /* Header - Top Toggle Design */
        .header {
            background: #2a2a2a;
            padding: 8px 12px;
            border-bottom: 2px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-top h2 {
            font-size: 16px;
            color: #ff4444;
            margin: 0;
            font-weight: 600;
        }

        .header-tabs {
            display: flex;
            flex-direction: row;
            gap: 4px;
            width: 100%;
            background: #333;
            border-radius: 8px;
            padding: 4px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            flex: 1;
            justify-content: center;
            text-align: center;
            min-height: 36px;
        }

        .tab.active {
            background: #ff4444;
            color: white;
            box-shadow: 0 2px 4px rgba(255, 68, 68, 0.3);
        }

        .tab:not(.active):hover {
            background: #444;
        }

        .tab i {
            font-size: 14px;
        }

        .admin-panel-btn {
            background: #444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .admin-panel-btn:hover {
            background: #ff4444;
            transform: translateY(-1px);
        }

        /* Chat Container - Mobile Optimized */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            height: calc(100vh - 80px);
        }

        /* FAQ Container - Mobile Optimized */
        .faq-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            height: calc(100vh - 80px);
        }

        /* Messages Area - Mobile Optimized */
        .messages-area {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: #1a1a1a;
            min-height: 150px;
            max-height: 65vh;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #444;
        }

        .message-content {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #ff4444;
            text-align: right;
        }

        .message-time {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Real-time message animations */
        .message.new-message {
            animation: slideInAndGlow 0.5s ease-out;
            border-left: 3px solid #ff4444;
        }

        @keyframes slideInAndGlow {
            0% { 
                opacity: 0; 
                transform: translateX(-20px) scale(0.95);
                box-shadow: 0 0 0 rgba(255, 68, 68, 0);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
            }
            100% { 
                opacity: 1; 
                transform: translateX(0) scale(1);
                box-shadow: 0 0 0 rgba(255, 68, 68, 0);
            }
        }

        /* Online status indicator */
        .user-online-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Quick Questions Section - Material 3 Design */
        .quick-questions-section {
            background: rgba(42, 42, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 12px;
            display: block;
            transition: all 0.3s ease;
            position: sticky;
            bottom: 0;
            z-index: 50;
            min-height: 120px;
            max-height: 60vh;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
        }

        .quick-questions-section::-webkit-scrollbar {
            width: 4px;
        }

        .quick-questions-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .quick-questions-section::-webkit-scrollbar-thumb {
            background: rgba(255, 68, 68, 0.3);
            border-radius: 2px;
        }

        .quick-questions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: rgba(42, 42, 42, 0.95);
            padding: 8px 0;
            z-index: 10;
        }

        .quick-questions-header h3 {
            color: #ff4444;
            font-size: 16px;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

                 .quick-questions-toggle {
             background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 68, 68, 0.25));

        .question-btn {
