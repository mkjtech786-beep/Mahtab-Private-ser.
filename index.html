<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Chat V3 Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b0b0f;font-family:Arial;
  display:flex;justify-content:center;align-items:center;height:100vh
}
.chat{
  width:380px;height:660px;background:#121212;border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 40px rgba(212,175,55,.3)
}
.header{padding:14px;background:#161616;border-bottom:1px solid #2a2a2a}
.header-title{color:#d4af37;font-weight:bold}
.header-status{font-size:12px;color:#8f8f8f}
.admin-bar{
  display:none;background:#d4af37;color:#000;
  text-align:center;font-size:12px;padding:6px;font-weight:bold
}
.messages{flex:1;padding:12px;overflow-y:auto;background:#0f0f0f}
.msg{
  max-width:78%;padding:10px 12px;margin-bottom:10px;
  border-radius:14px;font-size:14px;animation:fade .2s ease
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.user{background:#1f2a33;color:#fff;margin-left:auto}
.support{background:#1a1a1a;color:#d4af37}
.admin{background:#d4af37;color:#000}
.meta{font-size:10px;opacity:.6;margin-top:4px}
.user .meta{text-align:right}
.typing{display:none;font-size:12px;color:#888;padding:4px 12px}
.input-box{
  display:flex;padding:10px;background:#161616;border-top:1px solid #2a2a2a
}
.input-box input{
  flex:1;padding:11px;border:none;border-radius:12px;
  background:#0f0f0f;color:#fff;outline:none
}
.input-box button{
  margin-left:8px;padding:11px 16px;border:none;border-radius:12px;
  background:#d4af37;color:#000;font-weight:bold;cursor:pointer
}
</style>
</head>

<body>

<div class="chat">
  <div class="header">
    <div class="header-title" id="title">Telegram Help</div>
    <div class="header-status">online</div>
  </div>

  <div class="admin-bar" id="adminBar">ADMIN MODE</div>

  <div class="messages" id="messages"></div>

  <div class="typing" id="typing">typing…</div>

  <div class="input-box">
    <input id="input" placeholder="Type message">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const ADMIN_CODE="mahtab666777";
let isAdmin=false;

const messages=document.getElementById("messages");
const input=document.getElementById("input");
const adminBar=document.getElementById("adminBar");
const title=document.getElementById("title");

/* time */
function timeNow(){
  const d=new Date();
  return d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");
}

/* save/load */
function saveChat(){
  localStorage.setItem("chatData",messages.innerHTML);
}
function loadChat(){
  const data=localStorage.getItem("chatData");
  if(data) messages.innerHTML=data;
}
loadChat();

/* send */
function sendMsg(){
  const text=input.value.trim();
  if(!text) return;

  /* admin login */
  if(text===ADMIN_CODE){
    isAdmin=true;
    adminBar.style.display="block";
    title.innerText="Admin Panel";
    input.value="";
    return;
  }

  const div=document.createElement("div");
  div.className="msg "+(isAdmin?"admin":"user");
  div.innerHTML=text+`<div class="meta">${timeNow()}</div>`;
  messages.appendChild(div);
  input.value="";
  messages.scrollTop=messages.scrollHeight;
  saveChat();

  /* auto reply ONLY for user */
  if(!isAdmin){
    setTimeout(()=>{
      const r=document.createElement("div");
      r.className="msg support";
      r.innerHTML="Support will reply soon."+`<div class="meta">${timeNow()}</div>`;
      messages.appendChild(r);
      messages.scrollTop=messages.scrollHeight;
      saveChat();
    },800);
  }
}
</script>

</body>
</html>
