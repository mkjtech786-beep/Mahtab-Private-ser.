<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAHTAB PAID SERVER</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom styling for premium UI */
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #6e7dff, #70e1f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 50px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 3rem;
      font-weight: bold;
      color: white;
      margin-bottom: 20px;
    }
    .timer {
      font-size: 2.5rem;
      color: white;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .result {
      font-size: 2.5rem;
      font-weight: 700;
      margin-top: 20px;
      transition: all 1s ease-in-out;
    }
    .green {
      color: #32CD32;
    }
    .red {
      color: #FF6347;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MAHTAB PAID SERVER</h1>
    <div class="timer" id="timer">60s</div>
    <div class="result hidden" id="result"></div>
    <button class="hidden" id="startButton" onclick="startTimer()">Start Prediction</button>
  </div>

  <script>
    let countdown;
    let timeLeft = 60;  // Timer set to 60 seconds
    let predictionShown = false;

    // Start the prediction process
    function startTimer() {
      document.getElementById('startButton').classList.add('hidden'); // Hide button after start
      countdown = setInterval(function() {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft + "s";
        
        // When the timer hits zero, show the result
        if (timeLeft === 0) {
          clearInterval(countdown);
          showPrediction();
        }
      }, 1000);
    }

    // Function to show prediction result (Green or Red)
    function showPrediction() {
      const resultElement = document.getElementById('result');
      const result = Math.random() > 0.5 ? 'green' : 'red'; // Randomize prediction result

      resultElement.classList.remove('hidden');
      resultElement.classList.add(result);

      resultElement.innerText = result === 'green' ? 'Green - You Win!' : 'Red - You Lose!';
    }

    // Wait for DOM to load before showing the start button
    window.onload = () => {
      document.getElementById('startButton').classList.remove('hidden');
    }
  </script>
</body>
</html>
