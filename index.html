<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAHTAB Private Server</title>
  <style>
    /* Reset the default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Snow Animation */
    .snow-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .snow {
      position: absolute;
      width: 5px;
      height: 5px;
      background-color: white;
      opacity: 0.7;
      animation: snow 10s linear infinite;
    }

    @keyframes snow {
      0% { transform: translateY(-100px) translateX(0); }
      100% { transform: translateY(100vh) translateX(50px); }
    }

    /* Container styles */
    .container {
      z-index: 2;
      margin-top: -50px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .prediction-buttons button {
      font-size: 1.5rem;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      opacity: 0.8;
    }

    #greenBtn {
      background-color: green;
      color: white;
    }

    #redBtn {
      background-color: red;
      color: white;
    }

    .timer {
      font-size: 2rem;
      margin-top: 20px;
    }

    .result {
      font-size: 2rem;
      margin-top: 20px;
      display: none;
    }

    .green-result {
      color: green;
    }

    .red-result {
      color: red;
    }
  </style>
</head>
<body>
  <div class="snow-container"></div>
  <div class="container">
    <h1>MAHTAB Private Server</h1>
    <p>Make your prediction!</p>
    <div class="prediction-buttons">
      <button id="greenBtn">Green</button>
      <button id="redBtn">Red</button>
    </div>
    <div id="timer" class="timer">01:00</div>
    <div id="result" class="result"></div>
  </div>

  <script>
    // Variables
    let timer = 60;
    let timerInterval;
    let predictionMade = false;
    let snowflakes = [];

    // Elements
    const timerDisplay = document.getElementById('timer');
    const resultDisplay = document.getElementById('result');
    const greenBtn = document.getElementById('greenBtn');
    const redBtn = document.getElementById('redBtn');
    const snowContainer = document.querySelector('.snow-container');

    // Start Timer Function
    function startTimer() {
      timerInterval = setInterval(() => {
        if (timer > 0) {
          timer--;
          const minutes = Math.floor(timer / 60);
          const seconds = timer % 60;
          timerDisplay.textContent = `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
        } else {
          clearInterval(timerInterval);
          showResult();
        }
      }, 1000);
    }

    // Show Result Function
    function showResult() {
      // Simulate prediction outcome
      const correctPrediction = Math.random() < 0.5; // 50% chance for a correct prediction

      if (correctPrediction) {
        resultDisplay.textContent = 'Prediction: Correct!';
        resultDisplay.classList.add('green-result');
        resultDisplay.classList.remove('red-result');
      } else {
        resultDisplay.textContent = 'Prediction: Incorrect!';
        resultDisplay.classList.add('red-result');
        resultDisplay.classList.remove('green-result');
      }

      resultDisplay.style.display = 'block';
    }

    // Generate Snowflakes
    function generateSnowflakes() {
      const snowflakeCount = 100;
      
      for (let i = 0; i < snowflakeCount; i++) {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snow');
        snowflake.style.left = `${Math.random() * 100}vw`;
        snowflake.style.animationDuration = `${Math.random() * 3 + 5}s`;
        snowflake.style.animationDelay = `${Math.random() * 5}s`;

        snowflakes.push(snowflake);
        snowContainer.appendChild(snowflake);
      }
    }

    // Button Event Listeners
    greenBtn.addEventListener('click', () => {
      if (!predictionMade) {
        predictionMade = true;
        startTimer();
      }
    });

    redBtn.addEventListener('click', () => {
      if (!predictionMade) {
        predictionMade = true;
        startTimer();
      }
    });

    // Initialize
    generateSnowflakes();
  </script>
</body>
</html>
