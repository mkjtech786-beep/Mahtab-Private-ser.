<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Chat V4 PRO Admin</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

  // ✅ Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAqfguS1ucAtklcl06eB1JIWQr46XMpe7g",
    authDomain: "safe-chat-c0b9c.firebaseapp.com",
    databaseURL: "https://safe-chat-c0b9c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "safe-chat-c0b9c",
    storageBucket: "safe-chat-c0b9c.firebasestorage.app",
    messagingSenderId: "119640275300",
    appId: "1:119640275300:web:20ae984f4af1ffe6a62271"
  };

  const app = initializeApp(firebaseConfig);
  window.db = getDatabase(app);
</script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.chat{width:480px;height:750px;background:#121212;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(212,175,55,.3)}
.header{padding:14px;background:#161616;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
.header-title{color:#d4af37;font-weight:bold}
.header-status{font-size:12px;color:#8f8f8f}
.admin-bar{display:none;background:#d4af37;color:#000;text-align:center;font-size:12px;padding:6px;font-weight:bold}
.users-list{background:#1a1a1a;color:#fff;padding:8px;overflow-y:auto;height:100px}
.user-item{padding:6px;cursor:pointer;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
.user-item:hover{background:#2a2a2a}
.ban-btn{font-size:11px;color:#f00;cursor:pointer;margin-left:6px}
.messages{flex:1;padding:12px;overflow-y:auto;background:#0f0f0f}
.msg{max-width:78%;padding:10px 12px;margin-bottom:10px;border-radius:14px;font-size:14px;line-height:1.4;animation:fade .25s ease;position:relative}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.user{background:#1f2a33;color:#fff;margin-left:auto}
.support{background:#1a1a1a;color:#d4af37;margin-right:auto}
.admin{background:#d4af37;color:#000;margin-right:auto}
.meta{font-size:10px;opacity:.6;margin-top:4px}
.user .meta{text-align:right}
.support .meta,.admin .meta{text-align:left}
.delete-btn{position:absolute;top:2px;right:4px;font-size:10px;color:#f00;cursor:pointer}
.typing{display:none;font-size:12px;color:#888;padding:4px 12px}
.input-box{display:flex;padding:10px;background:#161616;border-top:1px solid #2a2a2a}
.input-box input{flex:1;padding:11px;border:none;border-radius:12px;background:#0f0f0f;color:#fff;outline:none}
.input-box button{margin-left:8px;padding:11px 16px;border:none;border-radius:12px;background:#d4af37;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>

<body>

<div class="chat">
  <div class="header">
    <div class="header-title" id="title">Telegram Help</div>
    <div class="header-status" id="status">online • 0 users</div>
  </div>

  <div class="admin-bar" id="adminBar">👑 ADMIN MODE ENABLED</div>

  <div class="users-list" id="usersList"></div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing">typing…</div>

  <div class="input-box">
    <input id="input" placeholder="Type message">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script type="module">
import { ref, push, onChildAdded, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const typing = document.getElementById("typing");
const adminBar = document.getElementById("adminBar");
const title = document.getElementById("title");
const status = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");
const usersList = document.getElementById("usersList");

const ADMIN_CODE = "mahtab666777";
let isAdmin = false;
let typingTimer;
let userId = "user_" + Math.floor(Math.random()*100000);
let selectedUser = null;

/* helpers */
function timeNow() {
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

/* Firebase refs */
const messagesRef = ref(window.db, 'messages');
const usersRef = ref(window.db, 'users');

/* Add user to users node */
set(ref(window.db,'users/'+userId),{banned:false});

/* Load users list */
function loadUsers(){
  usersList.innerHTML="";
  onValue(usersRef, snapshot=>{
    const data = snapshot.val();
    for(let uid in data){
      const userDiv = document.createElement("div");
      userDiv.className="user-item";
      userDiv.innerHTML = uid + (data[uid].banned ? " 🔒" : "");
      const banBtn = document.createElement("span");
      banBtn.className="ban-btn";
      banBtn.innerText = data[uid].banned ? "Unban" : "Ban";
      banBtn.onclick = ()=>{
        update(ref(window.db,'users/'+uid), {banned: !data[uid].banned});
      };
      userDiv.appendChild(banBtn);
      userDiv.onclick=()=>{
        selectedUser=uid;
        messages.innerHTML="";
      };
      usersList.appendChild(userDiv);
    }
  });
}

/* Load messages */
onChildAdded(messagesRef, data=>{
  const msg = data.val();
  // filter by selected user if admin
  if(isAdmin && selectedUser && msg.sender !== selectedUser && msg.sender !== "admin") return;

  const div = document.createElement("div");
  div.className = msg.sender === userId ? "msg user" : (msg.sender==="admin" ? "msg admin" : "msg support");
  div.innerHTML = msg.text + `<div class="meta">${msg.time}</div>`;

  if(isAdmin){
    const del = document.createElement("span");
    del.className="delete-btn";
    del.innerText="×";
    del.onclick = ()=> remove(ref(window.db,'messages/'+data.key));
    div.appendChild(del);
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
});

/* fake online count */
setInterval(()=>{status.innerText = `online • ${5+Math.floor(Math.random()*5)} users`;},4000);

/* typing indicator */
input.addEventListener("input", ()=>{
  typing.style.display="block";
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typing.style.display="none",700);
});

/* send message */
function sendMsg(){
  const text=input.value.trim();
  if(!text) return;

  /* admin login */
  if(text===ADMIN_CODE){
    isAdmin=true;
    adminBar.style.display="block";
    title.innerText="👑 Admin Panel";
    loadUsers();
    input.value="";
    return;
  }

  // check banned
  const userNode = ref(window.db,'users/'+userId);
  if(!isAdmin && selectedUser===null){ // normal user
    onValue(userNode,snap=>{
      if(snap.val().banned){
        alert("You are banned!");
        input.value="";
        return;
      }
    }, {onlyOnce:true});
  }

  const msgObj={
    sender: isAdmin ? (selectedUser?"admin":"admin") : userId,
    text:text,
    time:timeNow()
  };

  push(messagesRef,msgObj).then(()=>console.log("Message sent"))
  .catch(e=>console.error("Firebase push error:", e));

  input.value="";
  typing.style.display="none";
}

/* bind send button */
sendBtn.addEventListener("click", sendMsg);

/* bind Enter key */
input.addEventListener("keypress",(e)=>{if(e.key==="Enter") sendMsg();});
</script>

</body>
</html>
